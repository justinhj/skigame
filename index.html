<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SKI GAME</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a1a;
      font-family: 'Press Start 2P', monospace;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      touch-action: none;
    }

    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #game-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* CRT scanline overlay */
    #scanlines {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.12) 0px,
        rgba(0, 0, 0, 0.12) 1px,
        transparent 1px,
        transparent 3px
      );
    }

    #vignette {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 49;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.45) 100%);
    }

    /* HUD */
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 40;
      padding: 16px 20px;
      display: none;
      justify-content: space-between;
      align-items: flex-start;
      color: #fff;
      text-shadow: 3px 3px 0 #000;
      font-size: 11px;
      line-height: 1.8;
      pointer-events: none;
    }

    #hud .left, #hud .right { min-width: 140px; }
    #hud .right { text-align: right; }
    #hud .center {
      text-align: center;
      flex: 1;
    }

    #lives span {
      color: #ff6b9d;
      letter-spacing: 4px;
    }

    #level-up-banner {
      position: fixed;
      top: 22%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 46;
      color: #00ff88;
      font-size: 16px;
      text-shadow: 3px 3px 0 #000, 0 0 14px #00ff88;
      display: none;
      pointer-events: none;
      letter-spacing: 2px;
      text-align: center;
      line-height: 1.8;
    }

    #air-banner {
      position: fixed;
      top: 28%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 45;
      color: #ffee00;
      font-size: 18px;
      text-shadow: 3px 3px 0 #000, 0 0 12px #ffaa00;
      display: none;
      pointer-events: none;
      letter-spacing: 2px;
      animation: pulse 0.4s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { transform: translateX(-50%) scale(1); }
      to { transform: translateX(-50%) scale(1.08); }
    }

    #crash-flash {
      position: fixed;
      inset: 0;
      z-index: 48;
      background: #ff3366;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    /* Menus */
    .menu {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #1a0a2e 0%, #16213e 40%, #0f3460 100%);
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    .menu.hidden { display: none; }

    .menu h1 {
      font-size: clamp(18px, 4vw, 36px);
      color: #ff6b9d;
      text-shadow:
        4px 4px 0 #000,
        0 0 20px #ff6b9d;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .menu .menu-title {
      font-size: clamp(32px, 7vw, 56px);
      color: #ff6b9d;
      text-shadow:
        4px 4px 0 #000,
        0 0 20px #ff6b9d;
      margin-bottom: 24px;
      letter-spacing: 4px;
      animation: cool-flash 1.6s infinite alternate ease-in-out;
    }

    @keyframes cool-flash {
      0% {
        color: #ff6b9d;
        text-shadow:
          4px 4px 0 #000,
          0 0 10px #ff6b9d,
          0 0 30px #ff00ff;
      }
      100% {
        color: #ffee00;
        text-shadow:
          4px 4px 0 #000,
          0 0 15px #ffee00,
          0 0 35px #ff6b00;
      }
    }

    .menu-instructions {
      font-size: clamp(8px, 1.8vw, 11px);
      line-height: 1.6;
      color: #ffee00;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 2px 2px 0 #000;
      transition: opacity 0.5s ease-in-out;
      opacity: 0;
      margin-bottom: 24px;
      max-width: 480px;
      text-align: center;
    }

    .menu .press-key {
      font-size: clamp(10px, 2.2vw, 14px);
      color: #88ccff;
      margin-bottom: 28px;
      text-shadow: 2px 2px 0 #000;
      animation: press-key-blink 1.2s infinite steps(2, start);
    }

    @keyframes press-key-blink {
      to { visibility: hidden; }
    }

    .menu .pixel-skier {
      display: inline-block;
      width: 64px;
      height: 80px;
      margin: 0 auto 20px;
      image-rendering: pixelated;
    }

    .menu p {
      font-size: 9px;
      line-height: 2;
      color: #dde;
      max-width: 420px;
      margin-bottom: 8px;
      text-shadow: 2px 2px 0 #000;
    }

    .btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      padding: 16px 28px;
      border: 4px solid #fff;
      background: #ff6b9d;
      color: #fff;
      cursor: pointer;
      text-shadow: 2px 2px 0 #000;
      box-shadow: 6px 6px 0 #000;
      transition: transform 0.08s, box-shadow 0.08s;
      margin-top: 12px;
    }

    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0 #000;
      background: #ff8fb3;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #000;
    }

    .score-big {
      font-size: 22px;
      color: #ffee00;
      text-shadow: 3px 3px 0 #000;
      margin: 16px 0;
    }

    .high-score {
      font-size: 10px;
      color: #88ffaa;
      margin-bottom: 20px;
      text-shadow: 2px 2px 0 #000;
    }

    #stars {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .menu-content {
      position: relative;
      z-index: 1;
    }

    #howto {
      font-size: 8px;
      color: #99a;
      margin-top: 24px;
      line-height: 1.9;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="scanlines"></div>
  <div id="vignette"></div>
  <div id="crash-flash"></div>
  <div id="air-banner">AIR TIME!</div>

  <div id="hud">
    <div class="left">
      <div>SCORE <span id="score">0</span></div>
      <div id="lives">LIVES <span>♥♥♥</span></div>
    </div>
    <div class="center">
      <div id="combo"></div>
    </div>
    <div class="right">
      <div>LVL <span id="level-label">1</span></div>
      <div style="font-size:9px;margin-top:4px;color:#ffee00">SPD <span id="speed-label">36</span></div>
    </div>
  </div>
  <div id="level-up-banner">LEVEL UP!</div>
  <button id="mute-btn" style="position:fixed;top:16px;right:16px;z-index:100;font-family:'Press Start 2P', monospace;font-size:8px;background:#ff6b9d;color:#fff;border:3px solid #fff;padding:6px 10px;box-shadow:3px 3px 0 #000;cursor:pointer;image-rendering:pixelated;">MUSIC: ON</button>

  <!-- Title menu -->
  <div id="menu" class="menu">
    <div id="stars"></div>
    <div class="menu-content">
      <div id="menu-instructions" class="menu-instructions"></div>
      <h1 class="menu-title">SKI GAME</h1>
      <div class="press-key">PRESS ANY KEY TO PLAY</div>
      <canvas id="menu-skier" class="pixel-skier" width="64" height="80"></canvas>
      <p class="high-score" id="menu-high">HI-SCORE 0</p>
      <div id="howto">3 CRASHES = GAME OVER</div>
    </div>
  </div>

  <!-- Game over menu -->
  <div id="gameover" class="menu hidden">
    <div class="menu-content">
      <h1>WIPED OUT!</h1>
      <div class="subtitle">BETTER LUCK NEXT RUN</div>
      <p>YOUR SCORE</p>
      <div class="score-big" id="final-score">0</div>
      <p class="high-score" id="go-high">HI-SCORE 0</p>
      <button class="btn" id="retry-btn">TRY AGAIN</button>
      <button class="btn" id="menu-btn" style="background:#4488cc; margin-left: 8px;">MENU</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
import * as THREE from 'three';

// ─── Palette (80s neon / NES-ish) ───────────────────────────
const C = {
  skyTop: 0x1a0a3e,
  skyBot: 0x4a90d9,
  snow: 0xe8f4ff,
  snowShade: 0xc5d8ea,
  treeGreen: 0x1a8f4a,
  treeDark: 0x0d5c2e,
  trunk: 0x6b3a1f,
  pink: 0xff6b9d,
  yellow: 0xffee00,
  cyan: 0x44e0ff,
  purple: 0x9b59b6,
  orange: 0xff8844,
  skin: 0xffccaa,
  red: 0xff3355,
  blue: 0x3388ff,
  white: 0xffffff,
  black: 0x1a1a2e,
  boostGreen: 0x55ff77,
  boostGreenGlow: 0x88ffaa,
};

// ─── DOM ────────────────────────────────────────────────────
const container = document.getElementById('game-container');
const hud = document.getElementById('hud');
const menu = document.getElementById('menu');
const gameover = document.getElementById('gameover');
const scoreEl = document.getElementById('score');
const livesEl = document.querySelector('#lives span');
const speedLabel = document.getElementById('speed-label');
const levelLabel = document.getElementById('level-label');
const airBanner = document.getElementById('air-banner');
const levelUpBanner = document.getElementById('level-up-banner');
const crashFlash = document.getElementById('crash-flash');
const comboEl = document.getElementById('combo');
const finalScoreEl = document.getElementById('final-score');
const menuHigh = document.getElementById('menu-high');
const goHigh = document.getElementById('go-high');

// Mobile Detection & Dynamic Help Text
const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

// ─── Menu Instructions System ───────────────────────────────
const instructions = [
  "WELCOME TO SKI GAME",
  isMobile ? "DRAG LEFT/RIGHT TO CARVE" : "USE ARROWS OR A/D TO STEER",
  "HOLD SPACE TO CROUCH & CHARGE JUMP",
  "RELEASE ON GREEN ZONE FOR SUPER JUMP!",
  "DODGE TREES & OTHER SKIERS",
  "AIR TIME & LANDINGS GIVE BONUSES",
  "LEVEL UP EVERY 30S FOR MORE SPEED",
  "3 LIVES - GET THE HI-SCORE!"
];

if (isMobile) {
  const pressKeyEl = document.querySelector('.press-key');
  if (pressKeyEl) pressKeyEl.textContent = 'TAP SCREEN TO PLAY';
}

let instructionTimeoutId = null;
let instructionIndex = 0;

function startInstructions() {
  stopInstructions();
  const instEl = document.getElementById('menu-instructions');
  if (!instEl) return;
  
  instructionIndex = 0;
  
  function run() {
    if (state.mode !== 'menu') return;
    
    instEl.textContent = instructions[instructionIndex];
    instEl.style.opacity = '1';
    
    // Show instruction for 5 seconds
    instructionTimeoutId = setTimeout(() => {
      if (state.mode !== 'menu') return;
      
      // Fade out
      instEl.style.opacity = '0';
      
      // Wait for fade out (0.5s transition) + 1s of nothing = 1.5s
      instructionTimeoutId = setTimeout(() => {
        if (state.mode !== 'menu') return;
        instructionIndex = (instructionIndex + 1) % instructions.length;
        run();
      }, 1500);
    }, 5000);
  }
  
  run();
}

function stopInstructions() {
  if (instructionTimeoutId) {
    clearTimeout(instructionTimeoutId);
    instructionTimeoutId = null;
  }
}

// ─── Menu skier doodle ──────────────────────────────────────
(function drawMenuSkier() {
  const c = document.getElementById('menu-skier');
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  // simple pixel art skier
  const px = (x, y, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); };
  // skis
  px(8, 70, 22, 4, '#ffee00');
  px(34, 70, 22, 4, '#ffee00');
  // boots
  px(18, 58, 8, 12, '#ff6b9d');
  px(38, 58, 8, 12, '#ff6b9d');
  // body
  px(22, 34, 20, 26, '#44e0ff');
  // arms
  px(10, 38, 12, 8, '#44e0ff');
  px(42, 38, 12, 8, '#44e0ff');
  // poles
  px(8, 40, 3, 28, '#fff');
  px(53, 40, 3, 28, '#fff');
  // head
  px(24, 16, 16, 16, '#ffccaa');
  // hat
  px(22, 8, 20, 10, '#ff6b9d');
  px(26, 2, 12, 8, '#ff6b9d');
  // pom-pom
  px(28, 0, 8, 6, '#ffee00');
  // eyes
  px(28, 22, 3, 3, '#1a1a2e');
  px(37, 22, 3, 3, '#1a1a2e');
  // blush
  px(26, 26, 3, 2, '#ff88aa');
  px(39, 26, 3, 2, '#ff88aa');
  // smile
  px(30, 28, 6, 2, '#1a1a2e');
})();

// Twinkling stars on menu
(function stars() {
  const el = document.getElementById('stars');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.style.cssText = `
      position:absolute;
      width:${2 + (i % 3)}px; height:${2 + (i % 3)}px;
      background:${i % 4 === 0 ? '#ff6b9d' : i % 3 === 0 ? '#ffee00' : '#fff'};
      left:${Math.random() * 100}%; top:${Math.random() * 100}%;
      opacity:${0.3 + Math.random() * 0.7};
      box-shadow: 0 0 4px currentColor;
      animation: twinkle ${1 + Math.random() * 2}s infinite alternate;
    `;
    el.appendChild(s);
  }
  const style = document.createElement('style');
  style.textContent = `@keyframes twinkle { from { opacity: 0.2; } to { opacity: 1; } }`;
  document.head.appendChild(style);
})();

// ─── Game state ─────────────────────────────────────────────
const LEVEL_INTERVAL = 30; // seconds between level-ups
const BASE_SPEED = 36;
const SPEED_PER_LEVEL = 7;
const MAX_LEVEL = 20;

const state = {
  mode: 'menu', // menu | play | gameover
  score: 0,
  lives: 3,
  highScore: Math.floor(Number(localStorage.getItem('slopeRacerHi')) || 0),
  level: 1,
  levelTimer: 0,
  speed: BASE_SPEED,
  playerX: 0,
  playerY: 0, // vertical (air)
  velY: 0,
  onGround: true,
  airTime: 0,
  playerYaw: 0,
  cumulativeAirRotation: 0,
  spinSoundCooldown: 0,
  invincible: 0,
  distance: 0,
  difficulty: 1,
  keys: { left: false, right: false, space: false },
  lastPointerX: 0,
  touchDeltaX: 0,
  touchActive: false,
  isCrouching: false,
  crouchAmount: 0,
  crouchChargeTime: 0,
  isManualJump: false,
  objects: [],
  nextSpawnZ: -40,
  crashCooldown: 0,
  levelBannerTimer: 0,
  pendingSuperJump: false,
  lastManualJumpTime: -999,
  clock: new THREE.Clock(),
  anim: 0,
};

const N = {
  E2: 82.41, F2: 87.31, G2: 98.00, Gs2: 103.83, A2: 110.00, B2: 123.47,
  C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.00, Gs3: 207.65, A3: 220.00, B3: 246.94,
  C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00, Gs4: 415.30, A4: 440.00, B4: 493.88,
  C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, Gs5: 830.61, A5: 880.00, B5: 987.77,
  _: 0
};

const sfx = {
  ctx: null,
  musicInterval: null,
  nextNoteTime: 0,
  currentStep: 0,
  isMuted: false,
  tempo: 132, // BPM
  noiseBuffer: null,

  // 128-step multi-section 80s arcade soundtrack (~29s per cycle)
  bassSequence: [
    // Section 1: Main Groove (Am - F - C - G/E7)
    N.A2, N.A2, N.E3, N.A2, N.A2, N.C3, N.A2, N.E3,
    N.F2, N.F2, N.C3, N.F2, N.F2, N.A2, N.F2, N.C3,
    N.C3, N.C3, N.G3, N.C3, N.C3, N.E3, N.C3, N.G3,
    N.G2, N.G2, N.D3, N.G2, N.E2, N.Gs2, N.B2, N.E3,

    // Section 2: Syncopated Carving Run (Am - F - Dm - E7)
    N.A2, N.E3, N.A2, N.C3, N.A2, N.E3, N.A2, N.C3,
    N.F2, N.C3, N.F2, N.A2, N.F2, N.C3, N.F2, N.A2,
    N.D3, N.A3, N.D3, N.F3, N.D3, N.A3, N.F3, N.D3,
    N.E2, N.B2, N.E3, N.Gs3, N.E2, N.B2, N.Gs3, N.E3,

    // Section 3: Summit Chorus (C - G - Am - F/G)
    N.C3, N.G3, N.C3, N.E3, N.C3, N.G3, N.C3, N.E3,
    N.G2, N.D3, N.G2, N.B2, N.G2, N.D3, N.G2, N.B2,
    N.A2, N.E3, N.A2, N.C3, N.A2, N.E3, N.A2, N.C3,
    N.F2, N.C3, N.F2, N.A2, N.G2, N.D3, N.G2, N.B2,

    // Section 4: Downhill Speed Climax (F - G - Am - E7 Turnaround)
    N.F2, N.F2, N.C3, N.F2, N.F2, N.C3, N.A2, N.C3,
    N.G2, N.G2, N.D3, N.G2, N.G2, N.D3, N.B2, N.D3,
    N.A2, N.A2, N.E3, N.A2, N.A2, N.E3, N.C3, N.E3,
    N.E2, N.Gs2, N.B2, N.D3, N.E3, N.D3, N.B2, N.Gs2
  ],

  melodySequence: [
    // Section 1: Main Theme Melody
    N.A4, N._, N.C5, N._, N.B4, N._, N.A4, N._,
    N.C5, N._, N.D5, N._, N.E5, N._, N.D5, N.C5,
    N.E5, N._, N.G5, N._, N.E5, N.D5, N.C5, N._,
    N.D5, N._, N.B4, N._, N.E5, N._, N._, N._,

    // Section 2: Syncopated Carving Run
    N.A4, N.B4, N.C5, N.E5, N.D5, N.C5, N.B4, N.A4,
    N.F4, N.A4, N.C5, N.F5, N.E5, N.D5, N.C5, N.A4,
    N.D5, N.E5, N.F5, N.A5, N.G5, N.F5, N.E5, N.D5,
    N.B4, N._, N.C5, N._, N.B4, N.A4, N.Gs4, N.E4,

    // Section 3: Summit Chorus (Uplifting)
    N.E5, N._, N.G5, N._, N.A5, N._, N.G5, N._,
    N.D5, N._, N.F5, N._, N.G5, N._, N.F5, N.E5,
    N.C5, N._, N.E5, N._, N.F5, N._, N.E5, N.D5,
    N.A4, N._, N.C5, N._, N.D5, N.E5, N.D5, N._,

    // Section 4: Downhill Speed Climax (Rapid Arpeggio Run)
    N.C5, N.D5, N.E5, N.F5, N.E5, N.D5, N.C5, N.B4,
    N.D5, N.E5, N.F5, N.G5, N.F5, N.E5, N.D5, N.C5,
    N.E5, N.F5, N.G5, N.A5, N.G5, N.F5, N.E5, N.D5,
    N.B5, N._, N.Gs5, N._, N.E5, N._, N.D5, N.B4
  ],

  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
    if (!this.noiseBuffer && this.ctx) {
      const bufferSize = Math.floor(this.ctx.sampleRate * 0.1);
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      this.noiseBuffer = buffer;
    }
  },

  startMusic() {
    this.init();
    if (!this.ctx || this.musicInterval || this.isMuted) return;

    this.nextNoteTime = this.ctx.currentTime;
    this.currentStep = 0;

    // Scheduler tick every 75ms
    this.musicInterval = setInterval(() => {
      this.scheduler();
    }, 75);
  },

  stopMusic() {
    if (this.musicInterval) {
      clearInterval(this.musicInterval);
      this.musicInterval = null;
    }
  },

  toggleMute() {
    this.isMuted = !this.isMuted;
    if (this.isMuted) {
      this.stopMusic();
    } else if (state.mode === 'play') {
      this.startMusic();
    }
  },

  scheduler() {
    const scheduleAheadTime = 0.2; // How far ahead to schedule audio (seconds)
    const stepDuration = 60.0 / this.tempo / 2; // Eighth notes

    while (this.nextNoteTime < this.ctx.currentTime + scheduleAheadTime) {
      this.scheduleNote(this.currentStep, this.nextNoteTime);
      
      // Advance to next step (128-step cycle)
      this.nextNoteTime += stepDuration;
      this.currentStep = (this.currentStep + 1) % 128;
    }
  },

  scheduleNote(step, time) {
    if (this.isMuted) return;

    // 1. Bassline (Triangle wave)
    const bassFreq = this.bassSequence[step];
    if (bassFreq > 0) {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(bassFreq, time);
      gain.gain.setValueAtTime(0.16, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.21);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(time);
      osc.stop(time + 0.21);
    }

    // 2. Melody (Square wave with warm filter)
    const melodyFreq = this.melodySequence[step];
    if (melodyFreq > 0) {
      const osc = this.ctx.createOscillator();
      const filter = this.ctx.createBiquadFilter();
      const gain = this.ctx.createGain();
      
      osc.type = 'square';
      osc.frequency.setValueAtTime(melodyFreq, time);
      
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(3000, time);
      
      gain.gain.setValueAtTime(0.045, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.19);
      
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);
      
      osc.start(time);
      osc.stop(time + 0.19);
    }

    // 3. Chiptune Percussion (Snare & Hi-Hat)
    if (this.noiseBuffer) {
      // Snare on beats 2 & 4 (step % 4 === 2), or roll on turnaround (step >= 120)
      const isSnare = (step >= 120 && step % 2 === 0) || (step % 4 === 2);
      if (isSnare) {
        const noise = this.ctx.createBufferSource();
        noise.buffer = this.noiseBuffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1400, time);
        filter.Q.setValueAtTime(1.5, time);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.035, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(time);
        noise.stop(time + 0.08);
      } else if (step % 2 === 1) {
        // Crisp closed hi-hat on offbeats
        const noise = this.ctx.createBufferSource();
        noise.buffer = this.noiseBuffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(5000, time);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.015, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.03);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(time);
        noise.stop(time + 0.03);
      }
    }
  },

  playJump(superJump = false) {
    if (superJump) {
      this.playSuperJump();
      return;
    }
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(800, t + 0.25);
    
    gain.gain.setValueAtTime(0.12, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    
    osc.start(t);
    osc.stop(t + 0.25);
  },

  playSuperJump() {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;

    // Distinct multi-stage futuristic retro power chord sweep
    // 1. High energy laser pulse
    const osc1 = this.ctx.createOscillator();
    const gain1 = this.ctx.createGain();
    osc1.type = 'square';
    osc1.frequency.setValueAtTime(260, t);
    osc1.frequency.exponentialRampToValueAtTime(1600, t + 0.35);
    gain1.gain.setValueAtTime(0.18, t);
    gain1.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    osc1.connect(gain1);
    gain1.connect(this.ctx.destination);
    osc1.start(t);
    osc1.stop(t + 0.35);

    // 2. High fifth harmonic accent
    const osc2 = this.ctx.createOscillator();
    const gain2 = this.ctx.createGain();
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(520, t);
    osc2.frequency.exponentialRampToValueAtTime(2400, t + 0.4);
    gain2.gain.setValueAtTime(0.14, t);
    gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    osc2.connect(gain2);
    gain2.connect(this.ctx.destination);
    osc2.start(t);
    osc2.stop(t + 0.4);

    // 3. Celebratory sparkling arpeggio triplet
    [784, 1046.5, 1568].forEach((f, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, t + 0.06 * idx);
      gain.gain.setValueAtTime(0.12, t + 0.06 * idx);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06 * idx + 0.15);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t + 0.06 * idx);
      osc.stop(t + 0.06 * idx + 0.15);
    });
  },

  playSpin() {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    
    osc.type = 'square';
    osc.frequency.setValueAtTime(400, t);
    osc.frequency.linearRampToValueAtTime(600, t + 0.08);
    
    gain.gain.setValueAtTime(0.06, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    
    osc.start(t);
    osc.stop(t + 0.08);
  },

  playLanding() {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    // Retro double-beep chime
    const playBeep = (freq, delay, dur) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t + delay);
      gain.gain.setValueAtTime(0.08, t + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, t + delay + dur);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t + delay);
      osc.stop(t + delay + dur);
    };
    playBeep(523.25, 0, 0.08);   // C5
    playBeep(659.25, 0.08, 0.12); // E5
  },

  playCrash() {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const dur = 0.55;
    
    // Procedural white noise
    const bufferSize = this.ctx.sampleRate * dur;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    
    const noiseNode = this.ctx.createBufferSource();
    noiseNode.buffer = buffer;
    
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(800, t);
    filter.frequency.exponentialRampToValueAtTime(100, t + dur);
    
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.2, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    
    noiseNode.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    
    noiseNode.start(t);
    noiseNode.stop(t + dur);
  },

  playLevelUp() {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50]; // Ascending C major arpeggio
    notes.forEach((freq, i) => {
      const delay = i * 0.07;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t + delay);
      gain.gain.setValueAtTime(0.1, t + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.15);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t + delay);
      osc.stop(t + delay + 0.15);
    });
  }
};

function speedForLevel(level) {
  return BASE_SPEED + (level - 1) * SPEED_PER_LEVEL;
}

function makePeakMesh(w, h, col) {
  const shape = new THREE.Shape();
  shape.moveTo(-w / 2, 0);
  shape.lineTo(-w * 0.28, h * 0.45);
  shape.lineTo(-w * 0.05, h);
  shape.lineTo(w * 0.2, h * 0.55);
  shape.lineTo(w / 2, 0);
  shape.closePath();
  const geo = new THREE.ShapeGeometry(shape);
  // BasicMaterial + no fog so silhouettes stay crisp and visible
  const m = new THREE.MeshBasicMaterial({
    color: col,
    side: THREE.DoubleSide,
    fog: false,
    depthWrite: true,
  });
  const mesh = new THREE.Mesh(geo, m);
  return mesh;
}

function makeEvergreenMesh(w, h, col) {
  const shape = new THREE.Shape();
  // Simple evergreen tree silhouette: a trunk and three layers of triangles
  // Trunk
  const tw = w * 0.15;
  const th = h * 0.15;
  shape.moveTo(-tw / 2, 0);
  shape.lineTo(-tw / 2, th);
  // Bottom tier
  shape.lineTo(-w / 2, th);
  shape.lineTo(-w * 0.2, h * 0.45);
  // Middle tier
  shape.lineTo(-w * 0.35, h * 0.45);
  shape.lineTo(-w * 0.1, h * 0.75);
  // Top tier
  shape.lineTo(-w * 0.2, h * 0.75);
  shape.lineTo(0, h);
  // Mirror back down
  shape.lineTo(w * 0.2, h * 0.75);
  shape.lineTo(w * 0.1, h * 0.75);
  shape.lineTo(w * 0.35, h * 0.45);
  shape.lineTo(w * 0.2, h * 0.45);
  shape.lineTo(w / 2, th);
  shape.lineTo(tw / 2, th);
  shape.lineTo(tw / 2, 0);
  shape.closePath();

  const geo = new THREE.ShapeGeometry(shape);
  const m = new THREE.MeshBasicMaterial({
    color: col,
    side: THREE.DoubleSide,
    fog: false,
    depthWrite: true,
  });
  const mesh = new THREE.Mesh(geo, m);
  return mesh;
}

function buildMountainLayer({ side, xBase, zStart, count, spacing, speed, colors, sizeScale, yBase }) {
  const meshes = [];
  for (let i = 0; i < count; i++) {
    const w = (4 + Math.random() * 7) * sizeScale;
    const h = (3 + Math.random() * 6) * sizeScale;
    const col = colors[i % colors.length];
    const mesh = makeEvergreenMesh(w, h, col);
    const xJitter = (Math.random() - 0.5) * 4;
    const x = side * (xBase + Math.random() * 6) + xJitter;
    const z = zStart - i * spacing - Math.random() * spacing * 0.4;
    mesh.position.set(x, yBase, z);
    // Slight yaw so they're not perfectly flat to camera
    mesh.rotation.y = side * 0.15;
    track.add(mesh);
    meshes.push(mesh);
  }
  const wrapMax = 20;
  const wrapMin = zStart - count * spacing - 10;
  mountainLayers.push({ meshes, speed, wrapMin, wrapMax, span: wrapMax - wrapMin });
}

  g.add(box(0.15, 0.05, 1.0, C.white, -0.15, 0.04, 0));
  g.add(box(0.15, 0.05, 1.0, C.white, 0.15, 0.04, 0));
  // body
  g.add(box(0.35, 0.45, 0.25, suit, 0, 0.55, 0));
  // head
  g.add(box(0.28, 0.28, 0.28, C.skin, 0, 0.95, 0));
  // hat
  g.add(box(0.32, 0.14, 0.32, colors[(Math.floor(Math.random() * colors.length))], 0, 1.15, 0));
  // poles
  g.add(box(0.04, 0.6, 0.04, C.black, -0.3, 0.4, 0.1));
  g.add(box(0.04, 0.6, 0.04, C.black, 0.3, 0.4, 0.1));
  g.userData.radius = 0.55 * 1.3;
  g.userData.type = 'person';
  g.userData.drift = (Math.random() - 0.5) * 1.6;
  g.scale.set(1.3, 1.3, 1.3);
  return g;
}

function makeJump() {
  const g = new THREE.Group();

  // Boost approach pad (light green runway right in front of ramp)
  // Length 7.0, width 4.0, extends from z = +1.0 to z = +8.0 in front of ramp
  const boostGeo = new THREE.PlaneGeometry(4.0, 7.0);
  const boostMat = new THREE.MeshLambertMaterial({
    color: C.boostGreen,
    flatShading: true,
  });
  const boostPad = new THREE.Mesh(boostGeo, boostMat);
  boostPad.rotation.x = -Math.PI / 2;
  boostPad.position.set(0, 0.02, 4.5);
  g.add(boostPad);

  // Chevron directional arrows on the boost zone pointing into the ramp (-Z)
  for (let c = -1; c <= 1; c++) {
    const chev = box(2.4, 0.03, 0.45, 0xffffff, 0, 0.03, 4.5 + c * 1.8);
    g.add(chev);
  }

  // ramp wedge approximated with boxes
  const ramp = box(3.2, 0.15, 2.8, 0xa8c8e0, 0, 0.2, 0);
  ramp.rotation.x = -0.35;
  g.add(ramp);
  // side walls
  g.add(box(0.2, 0.6, 2.5, C.pink, -1.55, 0.35, 0));
  g.add(box(0.2, 0.6, 2.5, C.pink, 1.55, 0.35, 0));
  // flags
  g.add(box(0.08, 1.2, 0.08, C.white, -1.55, 0.9, -1));
  g.add(box(0.08, 1.2, 0.08, C.white, 1.55, 0.9, -1));
  g.add(box(0.5, 0.3, 0.08, C.yellow, -1.55, 1.4, -1));
  g.add(box(0.5, 0.3, 0.08, C.yellow, 1.55, 1.4, -1));
  g.userData.radius = 1.4;
  g.userData.type = 'jump';
  g.userData.used = false;
  return g;
}

// Snow particles
const flakes = [];
const flakeGeo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
const flakeMat = mat(C.white);
for (let i = 0; i < 80; i++) {
  const f = new THREE.Mesh(flakeGeo, flakeMat);
  f.position.set(
    (Math.random() - 0.5) * 30,
    Math.random() * 12,
    -Math.random() * 80
  );
  f.userData.fall = 1 + Math.random() * 3;
  f.userData.drift = (Math.random() - 0.5) * 2;
  track.add(f);
  flakes.push(f);
}

// Skier snow spray particles (emitted when turning left/right)
const sprayParticles = [];
const sprayGeo = new THREE.BoxGeometry(0.13, 0.13, 0.13);
const sprayMatWhite = mat(C.white);
const sprayMatIce = mat(0xcfe2ed);

for (let i = 0; i < 36; i++) {
  const p = new THREE.Mesh(sprayGeo, i % 2 === 0 ? sprayMatWhite : sprayMatIce);
  p.visible = false;
  p.userData.life = 0;
  p.userData.maxLife = 0.35;
  p.userData.vx = 0;
  p.userData.vy = 0;
  p.userData.vz = 0;
  track.add(p);
  sprayParticles.push(p);
}

function emitSpray(dir, spd) {
  let emitted = 0;
  const count = 3 + Math.floor(Math.random() * 3);
  const speedRatio = spd / BASE_SPEED;

  for (const p of sprayParticles) {
    if (!p.visible) {
      p.visible = true;
      p.userData.life = 0;
      p.userData.maxLife = 0.25 + Math.random() * 0.15;
      // Start behind the skis
      p.position.set(
        state.playerX + (Math.random() - 0.5) * 0.4 - dir * 0.25,
        0.06 + Math.random() * 0.1,
        0.5 + Math.random() * 0.4
      );
      // Spray shoots outward opposite to carve direction and upward/backward
      p.userData.vx = -dir * (4 + Math.random() * 6) * speedRatio;
      p.userData.vy = (2.5 + Math.random() * 3.5) * speedRatio;
      p.userData.vz = (spd * 0.5 + Math.random() * 8);
      emitted++;
      if (emitted >= count) break;
    }
  }
}

// ─── Spawning ───────────────────────────────────────────────
function isNearJump(x, z, jumpX, jumpZ) {
  // Check against the jump ramp spawned in the current wave
  if (jumpX !== null && jumpZ !== null) {
    if (Math.abs(z - jumpZ) < 14 && Math.abs(x - jumpX) < 5) {
      return true;
    }
  }
  // Check against existing jump ramps on the track
  for (const o of state.objects) {
    if (o.type === 'jump') {
      if (Math.abs(z - o.z) < 14 && Math.abs(x - o.x) < 5) {
        return true;
      }
    }
  }
  return false;
}

function isJumpNearTree(jx, jz) {
  for (const o of state.objects) {
    if (o.type === 'tree') {
      if (Math.abs(jz - o.z) < 14 && Math.abs(jx - o.x) < 5) {
        return true;
      }
    }
  }
  return false;
}

function clearObjects() {
  for (const o of state.objects) {
    track.remove(o.mesh);
  }
  state.objects = [];
  state.nextSpawnZ = -30;
}

function spawnAhead() {
  const z = state.nextSpawnZ;
  const diff = state.difficulty;

  // 1. Pre-determine jump ramp spawning to coordinate spacing
  let jumpX = null;
  let jumpZ = null;
  const willSpawnJump = Math.random() < 0.45 + Math.min(0.15, diff * 0.02);
  if (willSpawnJump) {
    for (let attempt = 0; attempt < 10; attempt++) {
      const candidateX = (Math.random() - 0.5) * (SLOPE_W - 8);
      const candidateZ = z - 4;
      if (!isJumpNearTree(candidateX, candidateZ)) {
        jumpX = candidateX;
        jumpZ = candidateZ;
        break;
      }
    }
  }

  // 2. Trees — denser with level, average count slightly increased
  const treeCount = 1 + Math.floor(Math.random() * (2.4 + Math.min(4.4, diff * 0.65)));
  for (let i = 0; i < treeCount; i++) {
    let treeX = 0;
    let treeZ = 0;
    let placed = false;
    for (let attempt = 0; attempt < 10; attempt++) {
      const candidateX = (Math.random() - 0.5) * (SLOPE_W - 4);
      const candidateZ = z - Math.random() * 8;
      if (!isNearJump(candidateX, candidateZ, jumpX, jumpZ)) {
        treeX = candidateX;
        treeZ = candidateZ;
        placed = true;
        break;
      }
    }
    if (placed) {
      const mesh = makeTree();
      mesh.position.set(treeX, 0, treeZ);
      track.add(mesh);
      state.objects.push({ mesh, type: 'tree', x: treeX, z: treeZ, radius: 0.75 });
    }
  }

  // 3. People
  if (Math.random() < 0.25 + diff * 0.04) {
    const mesh = makePerson();
    const x = (Math.random() - 0.5) * (SLOPE_W - 5);
    mesh.position.set(x, 0, z - Math.random() * 6);
    track.add(mesh);
    state.objects.push({
      mesh, type: 'person', x, z: mesh.position.z, radius: 0.72, drift: mesh.userData.drift, cleared: false,
    });
  }

  // 4. Actually spawn the pre-determined jump ramp
  if (jumpX !== null && jumpZ !== null) {
    const mesh = makeJump();
    mesh.position.set(jumpX, 0, jumpZ);
    track.add(mesh);
    state.objects.push({ mesh, type: 'jump', x: jumpX, z: jumpZ, radius: 1.5, used: false });
  }

  // Gap shrinks as difficulty rises
  const gap = Math.max(7, 17 - diff * 0.9) + Math.random() * 6;
  state.nextSpawnZ = z - gap;
}

// ─── Game flow ──────────────────────────────────────────────
function updateHigh() {
  const currentFloor = Math.floor(state.score);
  if (currentFloor > state.highScore) {
    state.highScore = currentFloor;
    localStorage.setItem('slopeRacerHi', String(state.highScore));
  }
  menuHigh.textContent = `HI-SCORE ${Math.floor(state.highScore)}`;
  goHigh.textContent = `HI-SCORE ${Math.floor(state.highScore)}`;
}

function startGame() {
  if (state.mode === 'play') return;
  stopInstructions();
  state.mode = 'play';
  state.score = 0;
  state.lives = 3;
  state.level = 1;
  state.levelTimer = 0;
  state.speed = speedForLevel(1);
  state.playerX = 0;
  state.playerY = 0;
  state.velY = 0;
  state.onGround = true;
  state.airTime = 0;
  state.playerYaw = 0;
  state.cumulativeAirRotation = 0;
  state.spinSoundCooldown = 0;
  state.invincible = 0;
  state.distance = 0;
  state.difficulty = 1;
  state.crashCooldown = 0;
  state.levelBannerTimer = 0;
  state.lastManualJumpTime = -999;
  state.nextSpawnZ = -25;
  state.touchActive = false;
  state.touchDeltaX = 0;
  state.keys.space = false;
  state.isCrouching = false;
  state.crouchAmount = 0;
  state.crouchChargeTime = 0;
  state.pendingSuperJump = false;
  state.isManualJump = false;
  player.position.set(0, 0, 0);
  player.rotation.set(0, 0, 0);
  player.scale.set(1, 1, 1);
  playerMesh.rotation.y = Math.PI;
  levelUpBanner.style.display = 'none';
  clearObjects();
  for (let i = 0; i < 8; i++) spawnAhead();

  menu.classList.add('hidden');
  gameover.classList.add('hidden');
  hud.style.display = 'flex';
  updateHUD();
  state.clock.start();
  sfx.startMusic();
}

function endGame() {
  state.mode = 'gameover';
  updateHigh();
  finalScoreEl.textContent = String(Math.floor(state.score));
  hud.style.display = 'none';
  airBanner.style.display = 'none';
  levelUpBanner.style.display = 'none';
  gameover.classList.remove('hidden');
  sfx.stopMusic();
}

function showMenu() {
  state.mode = 'menu';
  updateHigh();
  hud.style.display = 'none';
  airBanner.style.display = 'none';
  levelUpBanner.style.display = 'none';
  gameover.classList.add('hidden');
  menu.classList.remove('hidden');
  clearObjects();
  sfx.stopMusic();
  startInstructions();
}

function levelUp() {
  if (state.level >= MAX_LEVEL) return;
  state.level += 1;
  state.levelTimer = 0;
  state.speed = speedForLevel(state.level);
  state.difficulty = state.level;
  state.levelBannerTimer = 2.2;
  levelUpBanner.style.display = 'block';
  levelUpBanner.innerHTML = `LEVEL ${state.level}!<br><span style="font-size:10px;color:#ffee00">SPEED UP</span>`;
  updateHUD();
  sfx.playLevelUp();
}

function crash() {
  if (state.invincible > 0 || state.crashCooldown > 0) return;
  
  state.lives -= 1;
  state.crashCooldown = 1.2;
  state.invincible = 1.5;
  // brief wobble only — speed stays tied to level
  state.playerY = 0;
  state.velY = 0;
  state.onGround = true;
  state.isCrouching = false;
  state.crouchAmount = 0;
  state.crouchChargeTime = 0;
  state.pendingSuperJump = false;
  state.isManualJump = false;
  player.scale.set(1, 1, 1);
  state.playerYaw = 0;
  playerMesh.rotation.y = Math.PI;
  airBanner.style.display = 'none';

  crashFlash.style.opacity = '0.55';
  setTimeout(() => { crashFlash.style.opacity = '0'; }, 180);

  player.rotation.z = (Math.random() - 0.5) * 0.8;

  updateHUD();
  sfx.playCrash();
  if (state.lives <= 0) {
    setTimeout(endGame, 400);
  }
}

function updateHUD() {
  scoreEl.textContent = String(Math.floor(state.score));
  livesEl.textContent = '♥'.repeat(Math.max(0, state.lives)) + '♡'.repeat(Math.max(0, 3 - state.lives));
  speedLabel.textContent = String(Math.floor(state.speed));
  levelLabel.textContent = String(state.level);
}

function isPlayerInBoostZone() {
  if (!state.onGround || state.playerY >= 0.6) return null;
  const px = state.playerX;
  for (const o of state.objects) {
    if (o.type === 'jump' && !o.used) {
      // The boost pad is centered at (o.x, o.z + 4.5), length 7.0, width 4.0
      // In world Z, it extends from o.z + 1.0 to o.z + 8.0 in front of the ramp
      // Player at Z = 0 is on the pad when o.z is between -8.0 and -1.0
      const inZ = o.z >= -8.0 && o.z <= -1.0;
      const inX = Math.abs(px - o.x) <= 2.2;
      if (inZ && inX) {
        return o;
      }
    }
  }
  return null;
}

function startCrouch() {
  if (state.mode !== 'play') return;
  state.keys.space = true;
  if (state.onGround) {
    state.isCrouching = true;
    state.crouchChargeTime = 0;
  }
}

function releaseJump() {
  if (state.mode !== 'play') return;
  state.keys.space = false;

  if (state.onGround && state.isCrouching) {
    state.isCrouching = false;
    const isCharged = state.crouchChargeTime >= 0.08; // responsive charge
    const boostRamp = isPlayerInBoostZone();

    if (isCharged && boostRamp) {
      // Super Jump triggered on the green approach pad!
      boostRamp.used = true;
      boostRamp.mesh.userData.used = true;
      state.pendingSuperJump = false;

      state.onGround = false;
      state.isManualJump = false;
      state.velY = (8 + state.speed * 0.12) * 1.732; // 3x higher jump
      state.airTime = 0;
      state.cumulativeAirRotation = 0;
      sfx.playJump(true);

      const superPts = Math.floor(state.speed * 4.0);
      state.score += superPts;
      comboEl.textContent = `SUPER JUMP! +${superPts}`;
      setTimeout(() => { if (comboEl.textContent.startsWith('SUPER')) comboEl.textContent = ''; }, 1000);
    } else {
      // Regular manual jump
      const now = state.clock.getElapsedTime();
      state.lastManualJumpTime = now;
      state.onGround = false;
      state.isManualJump = true;
      state.velY = 6.8; // Clears other skiers (~1.05m apex > 0.95m), fails trees
      state.airTime = 0;
      state.cumulativeAirRotation = 0;
      sfx.playJump(false);
    }
  } else {
    state.isCrouching = false;
  }
}

// ─── Input ──────────────────────────────────────────────────
window.addEventListener('keydown', (e) => {
  sfx.init();
  
  if (state.mode === 'menu') {
    const isModifier = ['ShiftLeft', 'ShiftRight', 'ControlLeft', 'ControlRight', 'AltLeft', 'AltRight', 'MetaLeft', 'MetaRight'].includes(e.code);
    if (!isModifier) {
      startGame();
      e.preventDefault();
      return;
    }
  }

  if (e.code === 'ArrowLeft' || e.code === 'KeyA') { state.keys.left = true; e.preventDefault(); }
  if (e.code === 'ArrowRight' || e.code === 'KeyD') { state.keys.right = true; e.preventDefault(); }
  if (e.code === 'Space') {
    if (state.mode === 'play') {
      if (!e.repeat && !state.keys.space) {
        startCrouch();
      }
      e.preventDefault();
      return;
    }
  }
  if (e.code === 'Enter' || e.code === 'Space') {
    if (state.mode === 'gameover') {
      startGame();
      e.preventDefault();
    }
  }
  if (e.code === 'Escape' && state.mode === 'play') {
    endGame();
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') state.keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') state.keys.right = false;
  if (e.code === 'Space') {
    if (state.mode === 'play') {
      releaseJump();
      e.preventDefault();
    }
  }
});

// Mobile Pointer/Touch Steering & Start handlers
window.addEventListener('pointerdown', (e) => {
  sfx.init();
  
  if (state.mode === 'menu') {
    startGame();
    e.preventDefault();
    return;
  }
  
  if (state.mode === 'play') {
    if (e.target.tagName === 'BUTTON') return;
    state.touchActive = true;
    state.lastPointerX = e.clientX;
    state.touchDeltaX = 0;
  }
});

window.addEventListener('pointermove', (e) => {
  if (state.mode === 'play' && state.touchActive) {
    const currentX = e.clientX;
    state.touchDeltaX += currentX - state.lastPointerX;
    state.lastPointerX = currentX;
  }
});

window.addEventListener('pointerup', (e) => {
  if (state.mode === 'play') {
    state.touchActive = false;
    state.touchDeltaX = 0;
  }
});

window.addEventListener('pointercancel', (e) => {
  if (state.mode === 'play') {
    state.touchActive = false;
    state.touchDeltaX = 0;
  }
});

menu.addEventListener('click', () => {
  if (state.mode === 'menu') {
    sfx.init();
    startGame();
  }
});
document.getElementById('retry-btn').addEventListener('click', () => { sfx.init(); startGame(); });
document.getElementById('menu-btn').addEventListener('click', () => { sfx.init(); showMenu(); });

document.getElementById('mute-btn').addEventListener('click', () => {
  sfx.toggleMute();
  document.getElementById('mute-btn').textContent = sfx.isMuted ? 'MUSIC: OFF' : 'MUSIC: ON';
});

// ─── Resize ─────────────────────────────────────────────────
function onResize() {
  const w = Math.floor(window.innerWidth / PIXEL_SCALE);
  const h = Math.floor(window.innerHeight / PIXEL_SCALE);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', onResize);

// ─── Main loop ──────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(state.clock.getDelta(), 0.05);
  state.anim += dt;

  if (state.mode === 'play') {
    tickPlay(dt);
  } else {
    // idle bob on menu
    player.position.set(0, Math.sin(state.anim * 2) * 0.15, 0);
    player.rotation.y = Math.sin(state.anim * 0.8) * 0.3;
    shadow.position.set(0, 0.02, 0);
    shadow.scale.set(0.75, 1.35, 1);
    shadow.material.opacity = 0.5;
    camera.position.set(0, 9.5, 13);
    camera.lookAt(0, -1.5, -18);
    // gentle mountain drift on menu
    scrollMountains(8 * dt);
  }

  // snow flakes always
  for (const f of flakes) {
    f.position.y -= f.userData.fall * dt;
    f.position.x += f.userData.drift * dt;
    f.position.z += (state.mode === 'play' ? state.speed * 0.35 : 5) * dt;
    if (f.position.y < 0) {
      f.position.y = 10 + Math.random() * 5;
      f.position.x = state.playerX + (Math.random() - 0.5) * 28;
      f.position.z = -20 - Math.random() * 60;
    }
    if (f.position.z > 20) f.position.z = -80;
  }

  // blink invincibility
  if (state.mode === 'play' && state.invincible > 0) {
    player.visible = Math.floor(state.anim * 12) % 2 === 0;
  } else {
    player.visible = true;
  }

  renderer.render(scene, camera);
}

function scrollMountains(baseMove) {
  for (const layer of mountainLayers) {
    const m = baseMove * layer.speed;
    for (const mesh of layer.meshes) {
      mesh.position.z += m;
      if (mesh.position.z > layer.wrapMax) {
        mesh.position.z -= layer.span;
      }
    }
  }
}

function tickPlay(dt) {
  // Level timer — every 30s go faster
  state.levelTimer += dt;
  if (state.levelTimer >= LEVEL_INTERVAL) {
    levelUp();
  }
  if (state.levelBannerTimer > 0) {
    state.levelBannerTimer -= dt;
    if (state.levelBannerTimer <= 0) levelUpBanner.style.display = 'none';
  }

  // Speed locked to level
  state.speed = speedForLevel(state.level);
  state.difficulty = state.level;

  let steerInput = 0;
  if (state.keys.left) steerInput -= 1;
  if (state.keys.right) steerInput += 1;

  // Steering on ground, rotating in air
  if (state.onGround) {
    const steerSpeed = 18 + state.speed * 0.12;
    if (state.touchActive) {
      const sensitivity = 0.04; // 1 pixel = 0.04 units in 3D world
      state.playerX += state.touchDeltaX * sensitivity;
      steerInput = (state.touchDeltaX * sensitivity) / (steerSpeed * dt);
      steerInput = Math.max(-1.5, Math.min(1.5, steerInput));
    } else {
      state.playerX += steerInput * steerSpeed * dt;
    }
    const half = SLOPE_W / 2 - 1.2;
    state.playerX = Math.max(-half, Math.min(half, state.playerX));

    // Emit snow spray particles from skis when steering/carving
    if (Math.abs(steerInput) > 0.1) {
      emitSpray(Math.sign(steerInput), state.speed);
    }
  } else if (!state.isManualJump) {
    const rotSpeed = 7.5; // radians per second
    if (state.touchActive) {
      const airSensitivity = 0.015; // radians per pixel
      let yawChange = -state.touchDeltaX * airSensitivity;
      steerInput = (state.touchDeltaX * airSensitivity) / (rotSpeed * dt);
      steerInput = Math.max(-1.5, Math.min(1.5, steerInput));
      
      if (yawChange !== 0) {
        state.playerYaw += yawChange;
        state.cumulativeAirRotation += Math.abs(yawChange);
        state.score += Math.abs(yawChange) * 20;

        if (state.spinSoundCooldown <= 0) {
          sfx.playSpin();
          state.spinSoundCooldown = 0.12;
        }
      }
    } else {
      let yawChange = -steerInput * rotSpeed * dt;
      if (yawChange !== 0) {
        state.playerYaw += yawChange;
        state.cumulativeAirRotation += Math.abs(yawChange);
        state.score += Math.abs(yawChange) * 20;

        if (state.spinSoundCooldown <= 0) {
          sfx.playSpin();
          state.spinSoundCooldown = 0.12;
        }
      }
    }
  } else {
    // During manual jump, keep skier facing forward (no tricks/spins permitted)
    state.playerYaw = 0;
  }

  if (state.touchActive) {
    state.touchDeltaX = 0; // Consume the delta
  }

  if (state.spinSoundCooldown > 0) {
    state.spinSoundCooldown -= dt;
  }

  // Keep playerYaw normalized to [-PI, PI]
  state.playerYaw = (state.playerYaw + Math.PI) % (2 * Math.PI);
  if (state.playerYaw < 0) state.playerYaw += 2 * Math.PI;
  state.playerYaw -= Math.PI;

  // Update player mesh rotation Y
  playerMesh.rotation.y = Math.PI + state.playerYaw;

  // Track charge time while crouching on the ground
  if (state.onGround && state.isCrouching) {
    state.crouchChargeTime += dt;
  }

  // Visual crouch squash & stretch
  const targetCrouch = (state.onGround && state.isCrouching) ? 1 : 0;
  state.crouchAmount += (targetCrouch - state.crouchAmount) * 14 * dt;
  const scaleY = 1.0 - state.crouchAmount * 0.35; // squash down to 65% height
  const scaleXZ = 1.0 + state.crouchAmount * 0.18; // widen slightly when crouching
  player.scale.set(scaleXZ, scaleY, scaleXZ);

  // Lean
  const targetLean = -steerInput * 0.35;
  player.rotation.z += (targetLean - player.rotation.z) * 8 * dt;
  player.rotation.x = state.onGround ? (state.isCrouching ? -0.15 : 0) : -0.25;

  // Vertical / jump physics
  if (!state.onGround) {
    state.velY -= 22 * dt;
    state.playerY += state.velY * dt;
    state.airTime += dt;
    const airPts = state.airTime * state.speed * 0.8 * dt * 10;
    state.score += airPts;
    
    if (!state.isManualJump) {
      airBanner.style.display = 'block';
      const deg = Math.round(state.cumulativeAirRotation * (180 / Math.PI));
      airBanner.textContent = `SPIN: ${deg}° | AIR +${Math.floor(state.airTime * state.speed * 0.5)}`;
    }

    if (state.playerY <= 0) {
      state.playerY = 0;
      state.velY = 0;
      state.onGround = true;
      const wasManual = state.isManualJump;
      state.isManualJump = false;
      airBanner.style.display = 'none';

      // Landing check: facing backwards or forwards within 5 degrees
      const yawDeg = state.playerYaw * 180 / Math.PI;
      const distToForwards = Math.abs(yawDeg);
      const distToBackwards = 180 - Math.abs(yawDeg);
      const maxError = 25; // 25 degrees

      if (distToForwards <= maxError) {
        // Safe forward landing
        state.playerYaw = 0;
        playerMesh.rotation.y = Math.PI;
        sfx.playLanding();
        
        const airBonus = (!wasManual && state.airTime > 0.35) ? Math.floor(state.airTime * state.speed * 2.5) : 0;
        const spinBonus = !wasManual ? Math.floor(state.cumulativeAirRotation * 50) : 0;
        const totalBonus = airBonus + spinBonus;
        
        if (totalBonus > 0) {
          state.score += totalBonus;
          if (spinBonus > 0) {
            comboEl.textContent = `SPIN LANDING +${totalBonus}`;
          } else {
            comboEl.textContent = `LANDING +${totalBonus}`;
          }
          setTimeout(() => { if (comboEl.textContent.startsWith('SPIN') || comboEl.textContent.startsWith('LANDING')) comboEl.textContent = ''; }, 1200);
        }
      } else if (distToBackwards <= maxError) {
        // Safe backward landing
        state.playerYaw = Math.PI;
        playerMesh.rotation.y = 2 * Math.PI;
        sfx.playLanding();
        
        const airBonus = (!wasManual && state.airTime > 0.35) ? Math.floor(state.airTime * state.speed * 2.5) : 0;
        const spinBonus = !wasManual ? Math.floor(state.cumulativeAirRotation * 50) + 150 : 0;
        const totalBonus = airBonus + spinBonus;
        
        if (totalBonus > 0) {
          state.score += totalBonus;
          comboEl.textContent = `BACKWARD LANDING +${totalBonus}`;
          setTimeout(() => { if (comboEl.textContent.startsWith('BACKWARD')) comboEl.textContent = ''; }, 1200);
        }
      } else {
        // Crash / bad landing: lose 1 life
        crash();
        comboEl.textContent = `WIPEOUT! BAD LANDING`;
        setTimeout(() => { if (comboEl.textContent.startsWith('WIPEOUT')) comboEl.textContent = ''; }, 1200);
      }

      state.airTime = 0;
      state.cumulativeAirRotation = 0;
    }
  }

  player.position.x = state.playerX;
  player.position.y = state.playerY;
  player.position.z = 0;

  // Ground shadow stays on snow surface beneath skier and scales down with jump height
  shadow.position.x = state.playerX;
  shadow.position.z = 0;
  const shadowFactor = Math.max(0.2, 1.0 / (1.0 + state.playerY * 0.45));
  shadow.scale.set(0.75 * shadowFactor, 1.35 * shadowFactor, 1);
  shadow.material.opacity = Math.max(0.12, 0.5 * shadowFactor);

  const move = state.speed * dt;
  state.distance += move;

  // Score scales with level speed
  state.score += (state.speed * 0.4) * dt;

  // Move subtle OutRun road bands
  for (const b of roadBands) {
    b.position.z += move;
    if (b.position.z > 18) b.position.z -= roadBandCount * bandSpacing;
  }

  // Move snow spray particles
  for (const p of sprayParticles) {
    if (p.visible) {
      p.userData.life += dt;
      if (p.userData.life >= p.userData.maxLife) {
        p.visible = false;
      } else {
        p.position.x += p.userData.vx * dt;
        p.position.y += p.userData.vy * dt;
        p.userData.vy -= 12 * dt; // gravity on snow spray
        p.position.z += (move + p.userData.vz) * dt;
      }
    }
  }

  // Parallax mountains
  scrollMountains(move);
  bgMountainGroup.position.x = state.playerX * 0.45;

  // Move & collide objects
  const px = state.playerX;
  const pz = 0;
  const pr = 0.45;

  for (let i = state.objects.length - 1; i >= 0; i--) {
    const o = state.objects[i];
    if (o.type === 'person') {
      // Moves down slope at 1/3 player speed, so relative Z scroll is 2/3
      o.z += move * (2 / 3);
    } else {
      o.z += move;
    }
    o.mesh.position.z = o.z;

    if (o.type === 'person' && o.drift !== undefined) {
      // Occasional turns: 0.8% chance per frame (~once every 2 seconds)
      if (Math.random() < 0.008) {
        o.drift = (Math.random() - 0.5) * 2.2;
      }
      o.x += o.drift * dt;
      if (Math.abs(o.x) > SLOPE_W / 2 - 2) o.drift *= -1;
      o.mesh.position.x = o.x;
      // Lean/face the direction they carve + wiggle
      o.mesh.rotation.y = Math.sin(state.anim * 4 + i) * 0.15 + (o.drift * 0.25);
    }

    if (o.z > -3 && o.z < 2.5) {
      const dx = o.x - px;
      const dz = o.z - pz;
      const dist = Math.sqrt(dx * dx + dz * dz);
      if (dist < o.radius + pr) {
        if (o.type === 'jump' && !o.used) {
          // If the player is airborne above the ramp, fly over cleanly without triggering
          if (!state.onGround || state.playerY >= 0.6) {
            continue;
          }

          o.used = true;
          o.mesh.userData.used = true;

          state.onGround = false;
          state.isManualJump = false;
          state.isCrouching = false;
          state.velY = 8 + state.speed * 0.12;
          state.airTime = 0;
          state.cumulativeAirRotation = 0;
          sfx.playJump(false);

          const jumpPts = Math.floor(state.speed * 1.2);
          state.score += jumpPts;
          comboEl.textContent = `JUMP +${jumpPts}`;
          setTimeout(() => { if (comboEl.textContent.startsWith('JUMP')) comboEl.textContent = ''; }, 700);
        } else if (o.type === 'tree') {
          // Trees are tall and cannot be cleared by manual jump (need playerY >= 2.0 to clear)
          if (state.playerY < 2.0) {
            crash();
          }
        } else if (o.type === 'person') {
          // Other skiers are ~0.95m tall. If player is above 0.95m, they clear them!
          if (state.playerY < 0.95) {
            crash();
          } else if (!o.cleared) {
            o.cleared = true;
            state.score += 75;
            comboEl.textContent = `CLEARED SKIER! +75`;
            setTimeout(() => { if (comboEl.textContent.startsWith('CLEARED')) comboEl.textContent = ''; }, 800);
          }
        }
      }
    }

    if (o.z > 25) {
      track.remove(o.mesh);
      state.objects.splice(i, 1);
    }
  }

  let minZ = 0;
  for (const o of state.objects) if (o.z < minZ) minZ = o.z;
  while (minZ > -95 || state.objects.length < 8) {
    spawnAhead();
    minZ = state.nextSpawnZ;
    if (state.objects.length > 120) break;
  }

  if (state.invincible > 0) state.invincible -= dt;
  if (state.crashCooldown > 0) state.crashCooldown -= dt;

  // Camera: high chase, looking down the pitched run
  const camTargetX = state.playerX * 0.5;
  camera.position.x += (camTargetX - camera.position.x) * 4 * dt;
  camera.position.y = 9.2 + state.playerY * 0.35;
  camera.position.z = 12.5;
  // Look toward a point lower & further down the slope for downhill perspective
  camera.lookAt(state.playerX * 0.25, -2.2 + state.playerY * 0.4, -22);

  scene.fog.density = 0.01 + state.level * 0.0003;

  armL.rotation.x = Math.sin(state.anim * 8) * 0.15;
  armR.rotation.x = Math.sin(state.anim * 8 + 1) * 0.15;

  updateHUD();
}

// Kick off
updateHigh();
startInstructions();
state.clock.start();
animate();
  </script>
</body>
</html>
