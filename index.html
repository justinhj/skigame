<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SLOPE RACER '84</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a1a;
      font-family: 'Press Start 2P', monospace;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #game-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* CRT scanline overlay */
    #scanlines {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 50;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.12) 0px,
        rgba(0, 0, 0, 0.12) 1px,
        transparent 1px,
        transparent 3px
      );
    }

    #vignette {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 49;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.45) 100%);
    }

    /* HUD */
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 40;
      padding: 16px 20px;
      display: none;
      justify-content: space-between;
      align-items: flex-start;
      color: #fff;
      text-shadow: 3px 3px 0 #000;
      font-size: 11px;
      line-height: 1.8;
      pointer-events: none;
    }

    #hud .left, #hud .right { min-width: 140px; }
    #hud .right { text-align: right; }
    #hud .center {
      text-align: center;
      flex: 1;
    }

    #lives span {
      color: #ff6b9d;
      letter-spacing: 4px;
    }

    #level-up-banner {
      position: fixed;
      top: 22%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 46;
      color: #00ff88;
      font-size: 16px;
      text-shadow: 3px 3px 0 #000, 0 0 14px #00ff88;
      display: none;
      pointer-events: none;
      letter-spacing: 2px;
      text-align: center;
      line-height: 1.8;
    }

    #air-banner {
      position: fixed;
      top: 28%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 45;
      color: #ffee00;
      font-size: 18px;
      text-shadow: 3px 3px 0 #000, 0 0 12px #ffaa00;
      display: none;
      pointer-events: none;
      letter-spacing: 2px;
      animation: pulse 0.4s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { transform: translateX(-50%) scale(1); }
      to { transform: translateX(-50%) scale(1.08); }
    }

    #crash-flash {
      position: fixed;
      inset: 0;
      z-index: 48;
      background: #ff3366;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }

    /* Menus */
    .menu {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #1a0a2e 0%, #16213e 40%, #0f3460 100%);
      color: #fff;
      text-align: center;
      padding: 24px;
    }

    .menu.hidden { display: none; }

    .menu h1 {
      font-size: clamp(18px, 4vw, 36px);
      color: #ff6b9d;
      text-shadow:
        4px 4px 0 #000,
        0 0 20px #ff6b9d;
      margin-bottom: 8px;
      letter-spacing: 2px;
    }

    .menu .menu-title {
      font-size: clamp(32px, 7vw, 56px);
      color: #ff6b9d;
      text-shadow:
        4px 4px 0 #000,
        0 0 20px #ff6b9d;
      margin-bottom: 24px;
      letter-spacing: 4px;
      animation: cool-flash 1.6s infinite alternate ease-in-out;
    }

    @keyframes cool-flash {
      0% {
        color: #ff6b9d;
        text-shadow:
          4px 4px 0 #000,
          0 0 10px #ff6b9d,
          0 0 30px #ff00ff;
      }
      100% {
        color: #ffee00;
        text-shadow:
          4px 4px 0 #000,
          0 0 15px #ffee00,
          0 0 35px #ff6b00;
      }
    }

    .menu-instructions {
      font-size: clamp(8px, 1.8vw, 11px);
      line-height: 1.6;
      color: #ffee00;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 2px 2px 0 #000;
      transition: opacity 0.5s ease-in-out;
      opacity: 0;
      margin-bottom: 24px;
      max-width: 480px;
      text-align: center;
    }

    .menu .press-key {
      font-size: clamp(10px, 2.2vw, 14px);
      color: #88ccff;
      margin-bottom: 28px;
      text-shadow: 2px 2px 0 #000;
      animation: press-key-blink 1.2s infinite steps(2, start);
    }

    @keyframes press-key-blink {
      to { visibility: hidden; }
    }

    .menu .pixel-skier {
      display: inline-block;
      width: 64px;
      height: 80px;
      margin: 0 auto 20px;
      image-rendering: pixelated;
    }

    .menu p {
      font-size: 9px;
      line-height: 2;
      color: #dde;
      max-width: 420px;
      margin-bottom: 8px;
      text-shadow: 2px 2px 0 #000;
    }

    .btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      padding: 16px 28px;
      border: 4px solid #fff;
      background: #ff6b9d;
      color: #fff;
      cursor: pointer;
      text-shadow: 2px 2px 0 #000;
      box-shadow: 6px 6px 0 #000;
      transition: transform 0.08s, box-shadow 0.08s;
      margin-top: 12px;
    }

    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0 #000;
      background: #ff8fb3;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 #000;
    }

    .score-big {
      font-size: 22px;
      color: #ffee00;
      text-shadow: 3px 3px 0 #000;
      margin: 16px 0;
    }

    .high-score {
      font-size: 10px;
      color: #88ffaa;
      margin-bottom: 20px;
      text-shadow: 2px 2px 0 #000;
    }

    #stars {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .menu-content {
      position: relative;
      z-index: 1;
    }

    #howto {
      font-size: 8px;
      color: #99a;
      margin-top: 24px;
      line-height: 1.9;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="scanlines"></div>
  <div id="vignette"></div>
  <div id="crash-flash"></div>
  <div id="air-banner">AIR TIME!</div>

  <div id="hud">
    <div class="left">
      <div>SCORE <span id="score">0</span></div>
      <div id="lives">LIVES <span>♥♥♥</span></div>
    </div>
    <div class="center">
      <div id="combo"></div>
    </div>
    <div class="right">
      <div>LVL <span id="level-label">1</span></div>
      <div style="font-size:9px;margin-top:4px;color:#ffee00">SPD <span id="speed-label">36</span></div>
    </div>
  </div>
  <div id="level-up-banner">LEVEL UP!</div>
  <button id="mute-btn" style="position:fixed;top:16px;right:16px;z-index:100;font-family:'Press Start 2P', monospace;font-size:8px;background:#ff6b9d;color:#fff;border:3px solid #fff;padding:6px 10px;box-shadow:3px 3px 0 #000;cursor:pointer;image-rendering:pixelated;">MUSIC: ON</button>

  <!-- Title menu -->
  <div id="menu" class="menu">
    <div id="stars"></div>
    <div class="menu-content">
      <div id="menu-instructions" class="menu-instructions"></div>
      <h1 class="menu-title">SKI GAME</h1>
      <div class="press-key">PRESS ANY KEY TO PLAY</div>
      <canvas id="menu-skier" class="pixel-skier" width="64" height="80"></canvas>
      <p class="high-score" id="menu-high">HI-SCORE 0</p>
      <div id="howto">3 CRASHES = GAME OVER</div>
    </div>
  </div>

  <!-- Game over menu -->
  <div id="gameover" class="menu hidden">
    <div class="menu-content">
      <h1>WIPED OUT!</h1>
      <div class="subtitle">BETTER LUCK NEXT RUN</div>
      <p>YOUR SCORE</p>
      <div class="score-big" id="final-score">0</div>
      <p class="high-score" id="go-high">HI-SCORE 0</p>
      <button class="btn" id="retry-btn">TRY AGAIN</button>
      <button class="btn" id="menu-btn" style="background:#4488cc; margin-left: 8px;">MENU</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
import * as THREE from 'three';

// ─── Palette (80s neon / NES-ish) ───────────────────────────
const C = {
  skyTop: 0x1a0a3e,
  skyBot: 0x4a90d9,
  snow: 0xe8f4ff,
  snowShade: 0xc5d8ea,
  treeGreen: 0x1a8f4a,
  treeDark: 0x0d5c2e,
  trunk: 0x6b3a1f,
  pink: 0xff6b9d,
  yellow: 0xffee00,
  cyan: 0x44e0ff,
  purple: 0x9b59b6,
  orange: 0xff8844,
  skin: 0xffccaa,
  red: 0xff3355,
  blue: 0x3388ff,
  white: 0xffffff,
  black: 0x1a1a2e,
};

// ─── DOM ────────────────────────────────────────────────────
const container = document.getElementById('game-container');
const hud = document.getElementById('hud');
const menu = document.getElementById('menu');
const gameover = document.getElementById('gameover');
const scoreEl = document.getElementById('score');
const livesEl = document.querySelector('#lives span');
const speedLabel = document.getElementById('speed-label');
const levelLabel = document.getElementById('level-label');
const airBanner = document.getElementById('air-banner');
const levelUpBanner = document.getElementById('level-up-banner');
const crashFlash = document.getElementById('crash-flash');
const comboEl = document.getElementById('combo');
const finalScoreEl = document.getElementById('final-score');
const menuHigh = document.getElementById('menu-high');
const goHigh = document.getElementById('go-high');

// Mobile Detection & Dynamic Help Text
const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

// ─── Menu Instructions System ───────────────────────────────
const instructions = [
  "WELCOME TO SKI GAME",
  isMobile ? "SWIPE & HOLD TO STEER" : "USE ARROWS OR A/D TO STEER",
  "DODGE TREES & OTHER SKIERS",
  "JUMP RAMPS FOR MASSIVE AIR",
  "AIR TIME & LANDINGS GIVE BONUSES",
  "LEVEL UP EVERY 30S FOR MORE SPEED",
  "3 LIVES - GET THE HI-SCORE!"
];

if (isMobile) {
  const pressKeyEl = document.querySelector('.press-key');
  if (pressKeyEl) pressKeyEl.textContent = 'TAP SCREEN TO PLAY';
}

let instructionTimeoutId = null;
let instructionIndex = 0;

function startInstructions() {
  stopInstructions();
  const instEl = document.getElementById('menu-instructions');
  if (!instEl) return;
  
  instructionIndex = 0;
  
  function run() {
    if (state.mode !== 'menu') return;
    
    instEl.textContent = instructions[instructionIndex];
    instEl.style.opacity = '1';
    
    // Show instruction for 5 seconds
    instructionTimeoutId = setTimeout(() => {
      if (state.mode !== 'menu') return;
      
      // Fade out
      instEl.style.opacity = '0';
      
      // Wait for fade out (0.5s transition) + 1s of nothing = 1.5s
      instructionTimeoutId = setTimeout(() => {
        if (state.mode !== 'menu') return;
        instructionIndex = (instructionIndex + 1) % instructions.length;
        run();
      }, 1500);
    }, 5000);
  }
  
  run();
}

function stopInstructions() {
  if (instructionTimeoutId) {
    clearTimeout(instructionTimeoutId);
    instructionTimeoutId = null;
  }
}

// ─── Menu skier doodle ──────────────────────────────────────
(function drawMenuSkier() {
  const c = document.getElementById('menu-skier');
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  // simple pixel art skier
  const px = (x, y, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); };
  // skis
  px(8, 70, 22, 4, '#ffee00');
  px(34, 70, 22, 4, '#ffee00');
  // boots
  px(18, 58, 8, 12, '#ff6b9d');
  px(38, 58, 8, 12, '#ff6b9d');
  // body
  px(22, 34, 20, 26, '#44e0ff');
  // arms
  px(10, 38, 12, 8, '#44e0ff');
  px(42, 38, 12, 8, '#44e0ff');
  // poles
  px(8, 40, 3, 28, '#fff');
  px(53, 40, 3, 28, '#fff');
  // head
  px(24, 16, 16, 16, '#ffccaa');
  // hat
  px(22, 8, 20, 10, '#ff6b9d');
  px(26, 2, 12, 8, '#ff6b9d');
  // pom-pom
  px(28, 0, 8, 6, '#ffee00');
  // eyes
  px(28, 22, 3, 3, '#1a1a2e');
  px(37, 22, 3, 3, '#1a1a2e');
  // blush
  px(26, 26, 3, 2, '#ff88aa');
  px(39, 26, 3, 2, '#ff88aa');
  // smile
  px(30, 28, 6, 2, '#1a1a2e');
})();

// Twinkling stars on menu
(function stars() {
  const el = document.getElementById('stars');
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.style.cssText = `
      position:absolute;
      width:${2 + (i % 3)}px; height:${2 + (i % 3)}px;
      background:${i % 4 === 0 ? '#ff6b9d' : i % 3 === 0 ? '#ffee00' : '#fff'};
      left:${Math.random() * 100}%; top:${Math.random() * 100}%;
      opacity:${0.3 + Math.random() * 0.7};
      box-shadow: 0 0 4px currentColor;
      animation: twinkle ${1 + Math.random() * 2}s infinite alternate;
    `;
    el.appendChild(s);
  }
  const style = document.createElement('style');
  style.textContent = `@keyframes twinkle { from { opacity: 0.2; } to { opacity: 1; } }`;
  document.head.appendChild(style);
})();

// ─── Game state ─────────────────────────────────────────────
const LEVEL_INTERVAL = 30; // seconds between level-ups
const BASE_SPEED = 36;
const SPEED_PER_LEVEL = 7;
const MAX_LEVEL = 20;

const state = {
  mode: 'menu', // menu | play | gameover
  score: 0,
  lives: 3,
  highScore: parseInt(localStorage.getItem('slopeRacerHi') || '0', 10),
  level: 1,
  levelTimer: 0,
  speed: BASE_SPEED,
  playerX: 0,
  playerY: 0, // vertical (air)
  velY: 0,
  onGround: true,
  airTime: 0,
  playerYaw: 0,
  cumulativeAirRotation: 0,
  spinSoundCooldown: 0,
  invincible: 0,
  distance: 0,
  difficulty: 1,
  keys: { left: false, right: false },
  touchStartX: 0,
  touchActive: false,
  touchSteerValue: 0,
  objects: [],
  nextSpawnZ: -40,
  crashCooldown: 0,
  levelBannerTimer: 0,
  clock: new THREE.Clock(),
  anim: 0,
};

const sfx = {
  ctx: null,
  musicInterval: null,
  nextNoteTime: 0,
  currentStep: 0,
  isMuted: false,
  tempo: 130, // BPM

  // Retro bass sequence (A minor)
  bassSequence: [
    110.00, // A2
    110.00, // A2
    130.81, // C3
    98.00,  // G2
    110.00, // A2
    110.00, // A2
    164.81, // E3
    146.83  // D3
  ],

  // Simple melody sequence
  melodySequence: [
    440.00, 0,      493.88, 523.25,
    0,      587.33, 440.00, 0
  ],

  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  },

  startMusic() {
    this.init();
    if (!this.ctx || this.musicInterval || this.isMuted) return;

    this.nextNoteTime = this.ctx.currentTime;
    this.currentStep = 0;

    // Scheduler tick every 100ms
    this.musicInterval = setInterval(() => {
      this.scheduler();
    }, 100);
  },

  stopMusic() {
    if (this.musicInterval) {
      clearInterval(this.musicInterval);
      this.musicInterval = null;
    }
  },

  toggleMute() {
    this.isMuted = !this.isMuted;
    if (this.isMuted) {
      this.stopMusic();
    } else if (state.mode === 'play') {
      this.startMusic();
    }
  },

  scheduler() {
    const scheduleAheadTime = 0.2; // How far ahead to schedule audio (seconds)
    const stepDuration = 60.0 / this.tempo / 2; // Eighth notes

    while (this.nextNoteTime < this.ctx.currentTime + scheduleAheadTime) {
      this.scheduleNote(this.currentStep, this.nextNoteTime);
      
      // Advance to next step
      this.nextNoteTime += stepDuration;
      this.currentStep = (this.currentStep + 1) % 8;
    }
  },

  scheduleNote(step, time) {
    if (this.isMuted) return;

    // 1. Bassline (Triangle wave)
    const bassFreq = this.bassSequence[step];
    if (bassFreq > 0) {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(bassFreq, time);
      gain.gain.setValueAtTime(0.18, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.22);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(time);
      osc.stop(time + 0.22);
    }

    // 2. Melody (Square wave, quieter)
    const melodyFreq = this.melodySequence[step];
    if (melodyFreq > 0 && step % 2 === 0) {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(melodyFreq, time);
      gain.gain.setValueAtTime(0.04, time);
      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.18);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(time);
      osc.stop(time + 0.18);
    }
  },

  playJump() {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(800, t + 0.25);
    
    gain.gain.setValueAtTime(0.12, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    
    osc.start(t);
    osc.stop(t + 0.25);
  },

  playSpin() {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    
    osc.type = 'square';
    osc.frequency.setValueAtTime(400, t);
    osc.frequency.linearRampToValueAtTime(600, t + 0.08);
    
    gain.gain.setValueAtTime(0.06, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
    
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    
    osc.start(t);
    osc.stop(t + 0.08);
  },

  playLanding() {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    // Retro double-beep chime
    const playBeep = (freq, delay, dur) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(freq, t + delay);
      gain.gain.setValueAtTime(0.08, t + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, t + delay + dur);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t + delay);
      osc.stop(t + delay + dur);
    };
    playBeep(523.25, 0, 0.08);   // C5
    playBeep(659.25, 0.08, 0.12); // E5
  },

  playCrash() {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const dur = 0.55;
    
    // Procedural white noise
    const bufferSize = this.ctx.sampleRate * dur;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    
    const noiseNode = this.ctx.createBufferSource();
    noiseNode.buffer = buffer;
    
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(800, t);
    filter.frequency.exponentialRampToValueAtTime(100, t + dur);
    
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.2, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    
    noiseNode.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    
    noiseNode.start(t);
    noiseNode.stop(t + dur);
  },

  playLevelUp() {
    this.init();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50]; // Ascending C major arpeggio
    notes.forEach((freq, i) => {
      const delay = i * 0.07;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t + delay);
      gain.gain.setValueAtTime(0.1, t + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.15);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t + delay);
      osc.stop(t + delay + 0.15);
    });
  }
};

function speedForLevel(level) {
  return BASE_SPEED + (level - 1) * SPEED_PER_LEVEL;
}

function makePeakMesh(w, h, col) {
  const shape = new THREE.Shape();
  shape.moveTo(-w / 2, 0);
  shape.lineTo(-w * 0.28, h * 0.45);
  shape.lineTo(-w * 0.05, h);
  shape.lineTo(w * 0.2, h * 0.55);
  shape.lineTo(w / 2, 0);
  shape.closePath();
  const geo = new THREE.ShapeGeometry(shape);
  // BasicMaterial + no fog so silhouettes stay crisp and visible
  const m = new THREE.MeshBasicMaterial({
    color: col,
    side: THREE.DoubleSide,
    fog: false,
    depthWrite: true,
  });
  const mesh = new THREE.Mesh(geo, m);
  return mesh;
}

function makeEvergreenMesh(w, h, col) {
  const shape = new THREE.Shape();
  // Simple evergreen tree silhouette: a trunk and three layers of triangles
  // Trunk
  const tw = w * 0.15;
  const th = h * 0.15;
  shape.moveTo(-tw / 2, 0);
  shape.lineTo(-tw / 2, th);
  // Bottom tier
  shape.lineTo(-w / 2, th);
  shape.lineTo(-w * 0.2, h * 0.45);
  // Middle tier
  shape.lineTo(-w * 0.35, h * 0.45);
  shape.lineTo(-w * 0.1, h * 0.75);
  // Top tier
  shape.lineTo(-w * 0.2, h * 0.75);
  shape.lineTo(0, h);
  // Mirror back down
  shape.lineTo(w * 0.2, h * 0.75);
  shape.lineTo(w * 0.1, h * 0.75);
  shape.lineTo(w * 0.35, h * 0.45);
  shape.lineTo(w * 0.2, h * 0.45);
  shape.lineTo(w / 2, th);
  shape.lineTo(tw / 2, th);
  shape.lineTo(tw / 2, 0);
  shape.closePath();

  const geo = new THREE.ShapeGeometry(shape);
  const m = new THREE.MeshBasicMaterial({
    color: col,
    side: THREE.DoubleSide,
    fog: false,
    depthWrite: true,
  });
  const mesh = new THREE.Mesh(geo, m);
  return mesh;
}

function buildMountainLayer({ side, xBase, zStart, count, spacing, speed, colors, sizeScale, yBase }) {
  const meshes = [];
  for (let i = 0; i < count; i++) {
    const w = (4 + Math.random() * 7) * sizeScale;
    const h = (3 + Math.random() * 6) * sizeScale;
    const col = colors[i % colors.length];
    const mesh = makeEvergreenMesh(w, h, col);
    const xJitter = (Math.random() - 0.5) * 4;
    const x = side * (xBase + Math.random() * 6) + xJitter;
    const z = zStart - i * spacing - Math.random() * spacing * 0.4;
    mesh.position.set(x, yBase, z);
    // Slight yaw so they're not perfectly flat to camera
    mesh.rotation.y = side * 0.15;
    track.add(mesh);
    meshes.push(mesh);
  }
  const wrapMax = 20;
  const wrapMin = zStart - count * spacing - 10;
  mountainLayers.push({ meshes, speed, wrapMin, wrapMax, span: wrapMax - wrapMin });
}

function makeTree() {
  const g = new THREE.Group();
  // trunk
  g.add(box(0.35, 0.9, 0.35, C.trunk, 0, 0.45, 0));
  // layered cones as box pyramids
  const layers = [
    { y: 1.1, s: 1.4, c: C.treeDark },
    { y: 1.7, s: 1.1, c: C.treeGreen },
    { y: 2.2, s: 0.8, c: C.treeGreen },
    { y: 2.6, s: 0.5, c: 0x2ecf6a },
  ];
  layers.forEach((L) => {
    g.add(box(L.s, 0.55, L.s, L.c, 0, L.y, 0));
  });
  // snow cap
  g.add(box(0.35, 0.2, 0.35, C.white, 0, 2.9, 0));
  g.userData.radius = 0.7;
  g.userData.type = 'tree';
  return g;
}

function makePerson() {

// ─── Spawning ───────────────────────────────────────────────
function isNearJump(x, z, jumpX, jumpZ) {
  // Check against the jump ramp spawned in the current wave
  if (jumpX !== null && jumpZ !== null) {
    if (Math.abs(z - jumpZ) < 14 && Math.abs(x - jumpX) < 5) {
      return true;
    }
  }
  // Check against existing jump ramps on the track
  for (const o of state.objects) {
    if (o.type === 'jump') {
      if (Math.abs(z - o.z) < 14 && Math.abs(x - o.x) < 5) {
        return true;
      }
    }
  }
  return false;
}

function isJumpNearTree(jx, jz) {
  for (const o of state.objects) {
    if (o.type === 'tree') {
      if (Math.abs(jz - o.z) < 14 && Math.abs(jx - o.x) < 5) {
        return true;
      }
    }
  }
  return false;
}

function clearObjects() {
  for (const o of state.objects) {
    track.remove(o.mesh);
  }
  state.objects = [];
  state.nextSpawnZ = -30;
}

function spawnAhead() {
  const z = state.nextSpawnZ;
  const diff = state.difficulty;

  // 1. Pre-determine jump ramp spawning to coordinate spacing
  let jumpX = null;
  let jumpZ = null;
  const willSpawnJump = Math.random() < 0.45 + Math.min(0.15, diff * 0.02);
  if (willSpawnJump) {
    for (let attempt = 0; attempt < 10; attempt++) {
      const candidateX = (Math.random() - 0.5) * (SLOPE_W - 8);
      const candidateZ = z - 4;
      if (!isJumpNearTree(candidateX, candidateZ)) {
        jumpX = candidateX;
        jumpZ = candidateZ;
        break;
      }
    }
  }

  // 2. Trees — denser with level, average count slightly increased
  const treeCount = 1 + Math.floor(Math.random() * (2.4 + Math.min(4.4, diff * 0.65)));
  for (let i = 0; i < treeCount; i++) {
    let treeX = 0;
    let treeZ = 0;
    let placed = false;
    for (let attempt = 0; attempt < 10; attempt++) {
      const candidateX = (Math.random() - 0.5) * (SLOPE_W - 4);
      const candidateZ = z - Math.random() * 8;
      if (!isNearJump(candidateX, candidateZ, jumpX, jumpZ)) {
        treeX = candidateX;
        treeZ = candidateZ;
        placed = true;
        break;
      }
    }
    if (placed) {
      const mesh = makeTree();
      mesh.position.set(treeX, 0, treeZ);
      track.add(mesh);
      state.objects.push({ mesh, type: 'tree', x: treeX, z: treeZ, radius: 0.75 });
    }
  }

  // 3. People
  if (Math.random() < 0.25 + diff * 0.04) {
    const mesh = makePerson();
    const x = (Math.random() - 0.5) * (SLOPE_W - 5);
    mesh.position.set(x, 0, z - Math.random() * 6);
    track.add(mesh);
    state.objects.push({
      mesh, type: 'person', x, z: mesh.position.z, radius: 0.72, drift: mesh.userData.drift,
    });
  }

  // 4. Actually spawn the pre-determined jump ramp
  if (jumpX !== null && jumpZ !== null) {
    const mesh = makeJump();
    mesh.position.set(jumpX, 0, jumpZ);
    track.add(mesh);
    state.objects.push({ mesh, type: 'jump', x: jumpX, z: jumpZ, radius: 1.5, used: false });
  }

  // Gap shrinks as difficulty rises
  const gap = Math.max(7, 17 - diff * 0.9) + Math.random() * 6;
  state.nextSpawnZ = z - gap;
}

// ─── Game flow ──────────────────────────────────────────────
function updateHigh() {
  if (state.score > state.highScore) {
    state.highScore = state.score;
    localStorage.setItem('slopeRacerHi', String(state.highScore));
  }
  menuHigh.textContent = `HI-SCORE ${state.highScore}`;
  goHigh.textContent = `HI-SCORE ${state.highScore}`;
}

function startGame() {
  if (state.mode === 'play') return;
  stopInstructions();
  state.mode = 'play';
  state.score = 0;
  state.lives = 3;
  state.level = 1;
  state.levelTimer = 0;
  state.speed = speedForLevel(1);
  state.playerX = 0;
  state.playerY = 0;
  state.velY = 0;
  state.onGround = true;
  state.airTime = 0;
  state.playerYaw = 0;
  state.cumulativeAirRotation = 0;
  state.spinSoundCooldown = 0;
  state.invincible = 0;
  state.distance = 0;
  state.difficulty = 1;
  state.crashCooldown = 0;
  state.levelBannerTimer = 0;
  state.nextSpawnZ = -25;
  state.touchActive = false;
  state.touchSteerValue = 0;
  player.position.set(0, 0, 0);
  player.rotation.set(0, 0, 0);
  playerMesh.rotation.y = Math.PI;
  levelUpBanner.style.display = 'none';
  clearObjects();
  for (let i = 0; i < 8; i++) spawnAhead();

  menu.classList.add('hidden');
  gameover.classList.add('hidden');
  hud.style.display = 'flex';
  updateHUD();
  state.clock.start();
  sfx.startMusic();
}

function endGame() {
  state.mode = 'gameover';
  updateHigh();
  finalScoreEl.textContent = String(Math.floor(state.score));
  hud.style.display = 'none';
  airBanner.style.display = 'none';
  levelUpBanner.style.display = 'none';
  gameover.classList.remove('hidden');
  sfx.stopMusic();
}

function showMenu() {
  state.mode = 'menu';
  updateHigh();
  hud.style.display = 'none';
  airBanner.style.display = 'none';
  levelUpBanner.style.display = 'none';
  gameover.classList.add('hidden');
  menu.classList.remove('hidden');
  clearObjects();
  sfx.stopMusic();
  startInstructions();
}

function levelUp() {
  if (state.level >= MAX_LEVEL) return;
  state.level += 1;
  state.levelTimer = 0;
  state.speed = speedForLevel(state.level);
  state.difficulty = state.level;
  state.levelBannerTimer = 2.2;
  levelUpBanner.style.display = 'block';
  levelUpBanner.innerHTML = `LEVEL ${state.level}!<br><span style="font-size:10px;color:#ffee00">SPEED UP</span>`;
  updateHUD();
  sfx.playLevelUp();
}

function crash() {
  if (state.invincible > 0 || state.crashCooldown > 0) return;
  
  state.lives -= 1;
  state.crashCooldown = 1.2;
  state.invincible = 1.5;
  // brief wobble only — speed stays tied to level
  state.playerY = 0;
  state.velY = 0;
  state.onGround = true;
  state.playerYaw = 0;
  playerMesh.rotation.y = Math.PI;
  airBanner.style.display = 'none';

  crashFlash.style.opacity = '0.55';
  setTimeout(() => { crashFlash.style.opacity = '0'; }, 180);

  player.rotation.z = (Math.random() - 0.5) * 0.8;

  updateHUD();
  sfx.playCrash();
  if (state.lives <= 0) {
    setTimeout(endGame, 400);
  }
}

function updateHUD() {
  scoreEl.textContent = String(Math.floor(state.score));
  livesEl.textContent = '♥'.repeat(Math.max(0, state.lives)) + '♡'.repeat(Math.max(0, 3 - state.lives));
  speedLabel.textContent = String(Math.floor(state.speed));
  levelLabel.textContent = String(state.level);
}

// ─── Input ──────────────────────────────────────────────────
window.addEventListener('keydown', (e) => {
  sfx.init();
  
  if (state.mode === 'menu') {
    const isModifier = ['ShiftLeft', 'ShiftRight', 'ControlLeft', 'ControlRight', 'AltLeft', 'AltRight', 'MetaLeft', 'MetaRight'].includes(e.code);
    if (!isModifier) {
      startGame();
      e.preventDefault();
      return;
    }
  }

  if (e.code === 'ArrowLeft' || e.code === 'KeyA') { state.keys.left = true; e.preventDefault(); }
  if (e.code === 'ArrowRight' || e.code === 'KeyD') { state.keys.right = true; e.preventDefault(); }
  if (e.code === 'Enter' || e.code === 'Space') {
    if (state.mode === 'gameover') {
      startGame();
      e.preventDefault();
    }
  }
  if (e.code === 'Escape' && state.mode === 'play') {
    endGame();
  }
});
window.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') state.keys.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') state.keys.right = false;
});

// Mobile Touch Steering & Start handlers
window.addEventListener('touchstart', (e) => {
  sfx.init();
  
  if (state.mode === 'menu') {
    startGame();
    e.preventDefault();
    return;
  }
  
  if (state.mode === 'play') {
    if (e.target.tagName === 'BUTTON') return;
    state.touchActive = true;
    state.touchStartX = e.touches[0].clientX;
    state.touchSteerValue = 0;
  }
}, { passive: false });

window.addEventListener('touchmove', (e) => {
  if (state.mode === 'play' && state.touchActive) {
    const currentX = e.touches[0].clientX;
    const dx = currentX - state.touchStartX;
    const maxSwipeDist = 400; // Pixels for max steer (4x less sensitive than 100)
    const deadZone = 12; // Slightly larger deadzone for precision
    
    if (Math.abs(dx) < deadZone) {
      state.touchSteerValue = 0;
    } else {
      const sign = Math.sign(dx);
      const scaled = (Math.abs(dx) - deadZone) / (maxSwipeDist - deadZone);
      state.touchSteerValue = sign * Math.max(0, Math.min(1, scaled));
    }
    e.preventDefault(); // Prevent page scrolling
  }
}, { passive: false });

window.addEventListener('touchend', (e) => {
  if (state.mode === 'play') {
    state.touchActive = false;
    state.touchSteerValue = 0;
  }
});

window.addEventListener('touchcancel', (e) => {
  if (state.mode === 'play') {
    state.touchActive = false;
    state.touchSteerValue = 0;
  }
});

menu.addEventListener('click', () => {
  if (state.mode === 'menu') {
    sfx.init();
    startGame();
  }
});
document.getElementById('retry-btn').addEventListener('click', () => { sfx.init(); startGame(); });
document.getElementById('menu-btn').addEventListener('click', () => { sfx.init(); showMenu(); });

document.getElementById('mute-btn').addEventListener('click', () => {
  sfx.toggleMute();
  document.getElementById('mute-btn').textContent = sfx.isMuted ? 'MUSIC: OFF' : 'MUSIC: ON';
});

// ─── Resize ─────────────────────────────────────────────────
function onResize() {
  const w = Math.floor(window.innerWidth / PIXEL_SCALE);
  const h = Math.floor(window.innerHeight / PIXEL_SCALE);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', onResize);

// ─── Main loop ──────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(state.clock.getDelta(), 0.05);
  state.anim += dt;

  if (state.mode === 'play') {
    tickPlay(dt);
  } else {
    // idle bob on menu
    player.position.set(0, Math.sin(state.anim * 2) * 0.15, 0);
    player.rotation.y = Math.sin(state.anim * 0.8) * 0.3;
    camera.position.set(0, 9.5, 13);
    camera.lookAt(0, -1.5, -18);
    // gentle mountain drift on menu
    scrollMountains(8 * dt);
  }

  // snow flakes always
  for (const f of flakes) {
    f.position.y -= f.userData.fall * dt;
    f.position.x += f.userData.drift * dt;
    f.position.z += (state.mode === 'play' ? state.speed * 0.35 : 5) * dt;
    if (f.position.y < 0) {
      f.position.y = 10 + Math.random() * 5;
      f.position.x = state.playerX + (Math.random() - 0.5) * 28;
      f.position.z = -20 - Math.random() * 60;
    }
    if (f.position.z > 20) f.position.z = -80;
  }

  // blink invincibility
  if (state.mode === 'play' && state.invincible > 0) {
    player.visible = Math.floor(state.anim * 12) % 2 === 0;
  } else {
    player.visible = true;
  }

  renderer.render(scene, camera);
}

function scrollMountains(baseMove) {
  for (const layer of mountainLayers) {
    const m = baseMove * layer.speed;
    for (const mesh of layer.meshes) {
      mesh.position.z += m;
      if (mesh.position.z > layer.wrapMax) {
        mesh.position.z -= layer.span;
      }
    }
  }
}

function tickPlay(dt) {
  // Level timer — every 30s go faster
  state.levelTimer += dt;
  if (state.levelTimer >= LEVEL_INTERVAL) {
    levelUp();
  }
  if (state.levelBannerTimer > 0) {
    state.levelBannerTimer -= dt;
    if (state.levelBannerTimer <= 0) levelUpBanner.style.display = 'none';
  }

  // Speed locked to level
  state.speed = speedForLevel(state.level);
  state.difficulty = state.level;

  let steerInput = 0;
  if (state.keys.left) steerInput -= 1;
  if (state.keys.right) steerInput += 1;
  if (state.touchActive) {
    steerInput = state.touchSteerValue;
  }

  // Steering on ground, rotating in air
  if (state.onGround) {
    const steerSpeed = 18 + state.speed * 0.12;
    state.playerX += steerInput * steerSpeed * dt;
    const half = SLOPE_W / 2 - 1.2;
    state.playerX = Math.max(-half, Math.min(half, state.playerX));
  } else {
    const rotSpeed = 7.5; // radians per second
    let yawChange = -steerInput * rotSpeed * dt;
    
    if (yawChange !== 0) {
      state.playerYaw += yawChange;
      state.cumulativeAirRotation += Math.abs(yawChange);
      // score more points as you rotate
      state.score += Math.abs(yawChange) * 20;

      if (state.spinSoundCooldown <= 0) {
        sfx.playSpin();
        state.spinSoundCooldown = 0.12;
      }
    }
  }

  if (state.spinSoundCooldown > 0) {
    state.spinSoundCooldown -= dt;
  }

  // Keep playerYaw normalized to [-PI, PI]
  state.playerYaw = (state.playerYaw + Math.PI) % (2 * Math.PI);
  if (state.playerYaw < 0) state.playerYaw += 2 * Math.PI;
  state.playerYaw -= Math.PI;

  // Update player mesh rotation Y
  playerMesh.rotation.y = Math.PI + state.playerYaw;

  // Lean
  const targetLean = -steerInput * 0.35;
  player.rotation.z += (targetLean - player.rotation.z) * 8 * dt;
  player.rotation.x = state.onGround ? 0 : -0.25;

  // Vertical / jump physics
  if (!state.onGround) {
    state.velY -= 22 * dt;
    state.playerY += state.velY * dt;
    state.airTime += dt;
    const airPts = state.airTime * state.speed * 0.8 * dt * 10;
    state.score += airPts;
    
    airBanner.style.display = 'block';
    const deg = Math.round(state.cumulativeAirRotation * (180 / Math.PI));
    airBanner.textContent = `SPIN: ${deg}° | AIR +${Math.floor(state.airTime * state.speed * 0.5)}`;

    if (state.playerY <= 0) {
      state.playerY = 0;
      state.velY = 0;
      state.onGround = true;
      airBanner.style.display = 'none';

      // Landing check: facing backwards or forwards within 5 degrees
      const yawDeg = state.playerYaw * 180 / Math.PI;
      const distToForwards = Math.abs(yawDeg);
      const distToBackwards = 180 - Math.abs(yawDeg);
      const maxError = 25; // 25 degrees

      if (distToForwards <= maxError) {
        // Safe forward landing
        state.playerYaw = 0;
        playerMesh.rotation.y = Math.PI;
        sfx.playLanding();
        
        const airBonus = state.airTime > 0.35 ? Math.floor(state.airTime * state.speed * 2.5) : 0;
        const spinBonus = Math.floor(state.cumulativeAirRotation * 50);
        const totalBonus = airBonus + spinBonus;
        
        if (totalBonus > 0) {
          state.score += totalBonus;
          if (spinBonus > 0) {
            comboEl.textContent = `SPIN LANDING +${totalBonus}`;
          } else {
            comboEl.textContent = `LANDING +${totalBonus}`;
          }
          setTimeout(() => { if (comboEl.textContent.startsWith('SPIN') || comboEl.textContent.startsWith('LANDING')) comboEl.textContent = ''; }, 1200);
        }
      } else if (distToBackwards <= maxError) {
        // Safe backward landing
        state.playerYaw = Math.PI;
        playerMesh.rotation.y = 2 * Math.PI;
        sfx.playLanding();
        
        const airBonus = state.airTime > 0.35 ? Math.floor(state.airTime * state.speed * 2.5) : 0;
        const spinBonus = Math.floor(state.cumulativeAirRotation * 50) + 150; // extra bonus for landing backward
        const totalBonus = airBonus + spinBonus;
        
        state.score += totalBonus;
        comboEl.textContent = `BACKWARD LANDING +${totalBonus}`;
        setTimeout(() => { if (comboEl.textContent.startsWith('BACKWARD')) comboEl.textContent = ''; }, 1200);
      } else {
        // Crash / bad landing: lose 1 life
        crash();
        comboEl.textContent = `WIPEOUT! BAD LANDING`;
        setTimeout(() => { if (comboEl.textContent.startsWith('WIPEOUT')) comboEl.textContent = ''; }, 1200);
      }

      state.airTime = 0;
      state.cumulativeAirRotation = 0;
    }
  }

  player.position.x = state.playerX;
  player.position.y = state.playerY;
  player.position.z = 0;

  const move = state.speed * dt;
  state.distance += move;

  // Score scales with level speed
  state.score += (state.speed * 0.4) * dt;

  // Move stripes / lane markers
  for (const s of stripes) {
    s.position.z += move;
    if (s.position.z > 18) s.position.z -= 170;
  }

  // Parallax mountains
  scrollMountains(move);
  bgMountainGroup.position.x = state.playerX * 0.45;

  // Move & collide objects
  const px = state.playerX;
  const pz = 0;
  const pr = 0.45;

  for (let i = state.objects.length - 1; i >= 0; i--) {
    const o = state.objects[i];
    if (o.type === 'person') {
      // Moves down slope at 1/3 player speed, so relative Z scroll is 2/3
      o.z += move * (2 / 3);
    } else {
      o.z += move;
    }
    o.mesh.position.z = o.z;

    if (o.type === 'person' && o.drift !== undefined) {
      // Occasional turns: 0.8% chance per frame (~once every 2 seconds)
      if (Math.random() < 0.008) {
        o.drift = (Math.random() - 0.5) * 2.2;
      }
      o.x += o.drift * dt;
      if (Math.abs(o.x) > SLOPE_W / 2 - 2) o.drift *= -1;
      o.mesh.position.x = o.x;
      // Lean/face the direction they carve + wiggle
      o.mesh.rotation.y = Math.sin(state.anim * 4 + i) * 0.15 + (o.drift * 0.25);
    }

    if (o.z > -3 && o.z < 2.5) {
      const dx = o.x - px;
      const dz = o.z - pz;
      const dist = Math.sqrt(dx * dx + dz * dz);
      if (dist < o.radius + pr) {
        if (o.type === 'jump' && state.onGround && !o.used) {
          o.used = true;
          o.mesh.userData.used = true;
          state.onGround = false;
          state.velY = 8 + state.speed * 0.12;
          state.airTime = 0;
          state.cumulativeAirRotation = 0;
          sfx.playJump();
          const jumpPts = Math.floor(state.speed * 1.2);
          state.score += jumpPts;
          comboEl.textContent = `JUMP +${jumpPts}`;
          setTimeout(() => { if (comboEl.textContent.startsWith('JUMP')) comboEl.textContent = ''; }, 700);
        } else if ((o.type === 'tree' || o.type === 'person') && state.playerY < 1.1) {
          crash();
        }
      }
    }

    if (o.z > 25) {
      track.remove(o.mesh);
      state.objects.splice(i, 1);
    }
  }

  let minZ = 0;
  for (const o of state.objects) if (o.z < minZ) minZ = o.z;
  while (minZ > -95 || state.objects.length < 8) {
    spawnAhead();
    minZ = state.nextSpawnZ;
    if (state.objects.length > 120) break;
  }

  if (state.invincible > 0) state.invincible -= dt;
  if (state.crashCooldown > 0) state.crashCooldown -= dt;

  // Camera: high chase, looking down the pitched run
  const camTargetX = state.playerX * 0.5;
  camera.position.x += (camTargetX - camera.position.x) * 4 * dt;
  camera.position.y = 9.2 + state.playerY * 0.35;
  camera.position.z = 12.5;
  // Look toward a point lower & further down the slope for downhill perspective
  camera.lookAt(state.playerX * 0.25, -2.2 + state.playerY * 0.4, -22);

  scene.fog.density = 0.01 + state.level * 0.0003;

  armL.rotation.x = Math.sin(state.anim * 8) * 0.15;
  armR.rotation.x = Math.sin(state.anim * 8 + 1) * 0.15;

  updateHUD();
}

// Kick off
updateHigh();
startInstructions();
state.clock.start();
animate();
  </script>
</body>
</html>
